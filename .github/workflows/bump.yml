name: Brew Bump

on:
  schedule:
    - cron: "0 3,15 * * *"

  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/bump.yml"

jobs:
  bump:
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # main

      - name: Configure git
        uses: Homebrew/actions/git-user-config@3cdb78d0f62ad29dd32de765782654f4eedea607 # main

      - name: Trust tap
        run: |
          brew trust tb516/helium-browser-linux

      - name: Run brew bump
        env:
          HOMEBREW_DEVELOPER: 1
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            brew bump --tap "${GITHUB_REPOSITORY}" --no-pull-requests
          else
            brew bump --tap "${GITHUB_REPOSITORY}" --open-pr --no-fork
          fi
